name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run check
      - run: npm run test:production:hosting
      - run: node scripts/evaluate-model.mjs --self-test
      - run: npm run test:production:web
      - run: npm run test:integration:migration
      - run: npm run test:integration:access
      - run: npm run test:integration:runs
      - run: docker build -t reviewlens-app:local .
      - run: npm run test:production:compose
