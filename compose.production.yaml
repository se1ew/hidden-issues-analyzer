name: reviewlens
x-app: &app
  image: reviewlens-app:local
  build: .
  env_file: ${APP_ENV_FILE:-deploy/.env}
  environment: &environment
    NODE_ENV: production
    API_HOST: 0.0.0.0
    API_PORT: 4000
    WEB_DIST_DIR: /app/apps/web/dist
    DATABASE_URL: postgresql://hia:${POSTGRES_PASSWORD:?Create deploy/.env}@postgres:5432/hia_db
    REDIS_URL: redis://redis:6379
  extra_hosts:
    - host.docker.internal:host-gateway
  init: true
  restart: unless-stopped
  stop_grace_period: 30s

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create deploy/.env}
      POSTGRES_DB: hia_db
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, pg_isready -U hia -d hia_db]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis:/data
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    <<: *app
    restart: 'no'
    command: [node, /app/node_modules/prisma/build/index.js, migrate, deploy, --schema, prisma/schema.prisma]
    depends_on:
      postgres: { condition: service_healthy }
  api:
    <<: *app
    ports:
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:4000'
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 30
  worker:
    <<: *app
    command: [node, --max-old-space-size=768, dist/worker.js]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  postgres:
  redis:
